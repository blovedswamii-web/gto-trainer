[project]
name = "gto-trainer"
version = "0.1.0"
description = "Local-first Texas Hold'em GTO training tool"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "genanki>=0.13",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "treys>=0.1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gto_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exhaustive or long-running checks (deselect with -m 'not slow')"]
filterwarnings = ["ignore:Using `httpx`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4"]
ignore = ["N806", "N803", "RUF001", "RUF002", "RUF003"]  # NumPy-style capitalised matrices (M, C, Q) are idiomatic here

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["treys.*", "genanki.*", "numba.*"]
ignore_missing_imports = true
